model:
  n_ctx: 901
  n_vocab: 12
  n_layers: 4
  n_heads: 16
  n_loops: 16
  n_grad_loops: 4
  d_model: 512
  d_head: 32
  d_mlp: 2048
  causal: false
  grad_ckpt: true
  use_alpha: true
  use_beta: true
  use_gamma: true

train:
  lr: 1e-4
  n_warmup: 500
  n_batches: 10000
  batch_size: 128
  wt_decay: 0.1
  grad_norm: 1.0
  mixed_precision: bf16
  save_every: 10000
  save_path: checkpoints/arc
  wandb_name: gdn2-arc-l2-x8
  log_every: 10

arc:
  data_dir: data
  n_aug: 32
  n_eval_aug: 64
  puzzle_lr: 1e-2
  puzzle_wt_decay: 0.1
  eval_every: 2000
  eval_batch_size: 64
