model:
  n_ctx: 256
  n_vocab: 50257
  n_layers: 2
  n_heads: 4
  n_loops: 4
  d_model: 128
  d_head: 32
  d_mlp: 512

train:
  lr: 1e-3
  n_warmup: 200
  n_batches: 10000
  batch_size: 8
  wt_decay: 0.1
  grad_norm: 1.0
  mixed_precision: "no"
  save_every: 1000
  save_path: checkpoints
  wandb_name: gdn2-l2-x4
  log_every: 10
