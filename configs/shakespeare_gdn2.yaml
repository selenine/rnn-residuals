model:
  n_ctx: 256
  n_vocab: 65
  n_layers: 8
  n_heads: 4
  d_model: 64
  d_head: 16
  d_mlp: 256
  residual: gdn2

train:
  lr: 1e-3
  n_warmup: 200
  n_batches: 5000
  batch_size: 64
  wt_decay: 1.0
  grad_norm: 1.0
  mixed_precision: "no"
  save_every: 1000
  save_path: checkpoints/shakespeare_gdn2
  wandb_name: shakespeare-gdn2-l8
  log_every: 10
  data_dir: data
  eval_every: 250
  eval_batches: 20
  sample_tokens: 300
